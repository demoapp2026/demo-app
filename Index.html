<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda App - Demo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f9; color: #333; }
        header { background: #075e54; color: white; padding: 20px; text-align: center; }
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .product { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .btn { background: #25d366; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>Mi Tienda Online (Demo)</h1>
        <p>Catálogo interactivo de muestra</p>
    </header>
    <div class="container">
        <div class="product">
            <div>
                <h3>Zapatillas Urbanas</h3>
                <p>$U 2.490</p>
            </div>
            <button class="btn" onclick="alert('¡Producto agregado al carrito con éxito!')">Comprar</button>
        </div>
        <div class="product">
            <div>
                <h3>Reloj Smartwatch</h3>
                <p>$U 1.890</p>
            </div>
            <button class="btn" onclick="alert('¡Producto agregado al carrito con éxito!')">Comprar</button>
        </div>
    </div>
</body>
</html>
